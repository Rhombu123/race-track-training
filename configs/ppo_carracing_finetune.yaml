# Fine-tune config: continue from a trained checkpoint toward peak lap scores
env_id: CarRacing-v3
seed: 42
frame_stack: 4
resize: 84
n_envs: 2
use_subproc: true
total_timesteps: 1_000_000
policy: CnnPolicy
learning_rate: 0.0001
n_steps: 1024
batch_size: 128
n_epochs: 4
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.15
ent_coef: 0.005
vf_coef: 0.5
max_grad_norm: 0.5
log_dir: logs
model_dir: models
tb_log_name: ppo_carracing_ft
eval_freq: 10000
n_eval_episodes: 8
save_freq: 25000
device: cpu
